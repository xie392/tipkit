name: Bug Report
description: 报告一个 bug 或问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈 bug！请尽量提供详细信息。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚描述 bug 的现象
      placeholder: 发生了什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现？
      placeholder: |
        1. 创建编辑器并粘贴以下内容 ...
        2. 选中文本点击 ...
        3. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 使用的 @tipkit/* 包版本
      placeholder: e.g., 0.2.0
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器 / Node 版本 / 框架（Next.js 等）
      placeholder: Chrome 126, Node 20, Next.js 16
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错输出
      description: 粘贴相关错误信息或控制台日志
      render: shell
    validations:
      required: false
