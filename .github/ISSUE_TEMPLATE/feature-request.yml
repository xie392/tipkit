name: Feature Request
description: 建议新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！请描述你的想法。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么问题？
      placeholder: 我经常在 ... 时感到困扰
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望它如何工作？
      placeholder: 描述你理想的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否考虑过其他方案？
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他上下文、截图或示例
    validations:
      required: false
