<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
  </defs>
  <!-- TipKit Logo：渐变方块 + 纯白圆润 T + 品牌硬阴影 -->
  <!-- 硬偏移阴影 -->
  <rect x="18" y="26" width="92" height="92" rx="22" fill="rgba(16,16,16,0.16)"/>
  <!-- 主体方块 -->
  <rect x="10" y="14" width="92" height="92" rx="22" fill="url(#bg)"/>
  <!-- T 顶部横 -->
  <rect x="28" y="30" width="56" height="10" rx="5" fill="#fafafa"/>
  <!-- T 竖条 -->
  <rect x="51" y="40" width="10" height="52" rx="5" fill="#fafafa"/>
  <!-- 字标：衬线 TipKit -->
  <text x="130" y="82" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="62" font-weight="700" letter-spacing="-1" fill="#1a1a1a">TipKit</text>
</svg>
